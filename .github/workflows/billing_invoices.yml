name: Billing — Facturas Mensuales

# Corre el día 1 de cada mes a las 9:00 AM EST (= 14:00 UTC)
# Crea y envía facturas a Rex Direct y Ray Advertising
# con el revenue de Ringba del mes anterior.
#
# workflow_dispatch permite pruebas manuales en cualquier momento.

on:
  schedule:
    - cron: "0 14 1 * *"        # 9:00 AM EST, día 1 de cada mes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY RUN — crea facturas en Zoho pero NO las envía por email"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  facturar:
    name: Generar y enviar facturas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: billing/requirements.txt

      - name: Instalar dependencias
        run: pip install -r billing/requirements.txt

      - name: Generar facturas
        run: python billing/invoice_generator.py
        env:
          RINGBA_API_TOKEN:            ${{ secrets.RINGBA_API_TOKEN }}
          RINGBA_ACCOUNT_ID:           ${{ secrets.RINGBA_ACCOUNT_ID }}
          ZOHO_CLIENT_ID:              ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET:          ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN:          ${{ secrets.ZOHO_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BILLING_SPREADSHEET_ID:      ${{ secrets.BILLING_SPREADSHEET_ID }}
          DISCORD_WEBHOOK_BILLING:     ${{ secrets.DISCORD_WEBHOOK_BILLING }}
          DRY_RUN:                     ${{ github.event.inputs.dry_run || 'false' }}
