name: Billing — CRM Setup Inicial

# Correr UNA SOLA VEZ manualmente para:
#   1. Crear todos los buyers como cuentas en Zoho CRM
#   2. Importar todas las facturas del Sheet como deals en CRM
#   3. Marcar las facturas pagadas como Closed Won

on:
  workflow_dispatch:

jobs:
  crm-setup:
    name: Setup inicial Zoho CRM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: billing/requirements.txt

      - name: Instalar dependencias
        run: pip install -r billing/requirements.txt

      - name: Ejecutar CRM setup
        run: python billing/crm_setup.py
        env:
          ZOHO_CLIENT_ID:              ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET:          ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN_CRM:      ${{ secrets.ZOHO_REFRESH_TOKEN_CRM }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BILLING_SPREADSHEET_ID:      ${{ secrets.BILLING_SPREADSHEET_ID }}
