name: Contabilidad — Calcular Mes

# Activación MANUAL desde GitHub Actions → Run workflow.
# Introduce el mes a calcular en formato MM/YYYY.
# Escribe la tabla mensual en la hoja "2026" del spreadsheet.

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Mes a calcular (MM/YYYY) — ej: 03/2026"
        required: true

jobs:
  calcular:
    name: Calcular mes ${{ github.event.inputs.month }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: profit/requirements.txt

      - name: Instalar dependencias
        run: pip install -r profit/requirements.txt

      - name: Ejecutar cálculo mensual
        run: python profit/monthly_accounting.py
        env:
          MONTH:                       ${{ github.event.inputs.month }}
          RINGBA_API_TOKEN:            ${{ secrets.RINGBA_API_TOKEN }}
          RINGBA_ACCOUNT_ID:           ${{ secrets.RINGBA_ACCOUNT_ID }}
          META_ACCESS_TOKEN:           ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION:            ${{ vars.META_API_VERSION || 'v25.0' }}
          DISCORD_WEBHOOK_MOD:         ${{ secrets.DISCORD_WEBHOOK_MOD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID:              ${{ secrets.SPREADSHEET_ID }}
