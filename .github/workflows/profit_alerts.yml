name: Profit — Alertas Inteligentes

# Disparado desde Railway (ver abajo). El script verifica horario internamente:
#   Meta Ads : no alerta antes de las 10:00 AM VET (UTC-4)
#   Ringba   : no alerta entre 12am y 6am VET (UTC-4)
#
# Envía alertas individuales a Discord:
#   MBs internos  → DISCORD_WEBHOOK_ALERTS_INTERNAL  (#mb-alerts internos)
#   MBs externos  → DISCORD_WEBHOOK_ALERTS_EXTERNAL  (#mb-alerts externos)
#   Grupo privado → DISCORD_WEBHOOK_ALERTS_PRIVATE   (canal de Angela; fallback #mod)
#
# Llamadas = Ringba (ventana desde la corrida anterior, 1-3h) + CallGrid
# (acumulado de hoy menos el de la corrida anterior — su API no da horas).
# Run workflow con coverage_report=true → reporte por MB a #mod.
#
# El estado anti-spam se persiste entre runs via GitHub Actions cache.

on:
  # Sin `schedule:` — GitHub lo descartaba (3-7 corridas/día en vez de 24,
  # confirmado 2026-10-28). Lo dispara manychat/main.py desde Railway:
  #   :20 → mode=meta   (10-23 VET)
  #   :40 → mode=calls  (6-23 VET)
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué alertas correr"
        type: choice
        options: [all, meta, calls]
        default: all
      coverage_report:
        description: "Solo enviar a #mod el reporte de cobertura por MB (Ringba vs CallGrid hoy), sin alertas"
        type: boolean
        default: false

# Las corridas de Meta y de llamadas comparten el estado anti-spam (cache):
# nunca en paralelo, para que una no pise el estado de la otra.
concurrency:
  group: profit-alerts
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  alerts:
    name: Meta + Ringba Alerts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restaurar estado de alertas (anti-spam)
        uses: actions/cache/restore@v4
        with:
          path: profit/alerts_state/
          key: alerts-state-${{ github.run_id }}
          restore-keys: |
            alerts-state-

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: profit/requirements.txt

      - name: Instalar dependencias
        run: pip install -r profit/requirements.txt

      - name: Ejecutar alertas
        run: python profit/alerts.py
        env:
          RINGBA_API_TOKEN:            ${{ secrets.RINGBA_API_TOKEN }}
          RINGBA_ACCOUNT_ID:           ${{ secrets.RINGBA_ACCOUNT_ID }}
          META_ACCESS_TOKEN:           ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION:            ${{ vars.META_API_VERSION || 'v25.0' }}
          DISCORD_WEBHOOK_MOD:              ${{ secrets.DISCORD_WEBHOOK_MOD }}
          DISCORD_WEBHOOK_ALERTS_INTERNAL:  ${{ secrets.DISCORD_WEBHOOK_ALERTS_INTERNAL }}
          DISCORD_WEBHOOK_ALERTS_EXTERNAL:  ${{ secrets.DISCORD_WEBHOOK_ALERTS_EXTERNAL }}
          DISCORD_WEBHOOK_ALERTS_PRIVATE:   ${{ secrets.DISCORD_WEBHOOK_ALERTS_PRIVATE }}
          DISCORD_WEBHOOKS_MB_JSON:         ${{ secrets.DISCORD_WEBHOOKS_MB_JSON }}
          CALLGRID_API_KEY:                 ${{ secrets.CALLGRID_API_KEY }}
          CALLGRID_ORG_ID:                  ${{ secrets.CALLGRID_ORG_ID }}
          COVERAGE_REPORT:                  ${{ github.event.inputs.coverage_report || 'false' }}
          ALERTS_MODE:                      ${{ github.event.inputs.mode || 'all' }}

      - name: Guardar estado de alertas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: profit/alerts_state/
          key: alerts-state-${{ github.run_id }}
