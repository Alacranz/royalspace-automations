name: Contabilidad — Recordatorio Semanal

# Cada lunes a las 9:00 AM EST (14:00 UTC).
# Solo envía un recordatorio a Discord #mod.
# NO ejecuta cálculos ni toca el Sheet.

on:
  schedule:
    - cron: "0 14 * * 1"   # 9:00 AM EST (UTC-5) · lunes
  workflow_dispatch:

jobs:
  recordatorio:
    name: Recordatorio contabilidad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: profit/requirements.txt

      - name: Instalar dependencias
        run: pip install -r profit/requirements.txt

      - name: Enviar recordatorio
        run: python profit/accounting_reminder.py
        env:
          DISCORD_WEBHOOK_MOD: ${{ secrets.DISCORD_WEBHOOK_MOD }}
