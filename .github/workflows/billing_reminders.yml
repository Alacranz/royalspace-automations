name: Billing — Recordatorios Semanales

# Corre cada lunes a las 9:00 AM EST (= 14:00 UTC).
# Envía a Discord:
#   1. Revenue acumulado del mes actual por buyer (todos)
#   2. Facturas pendientes con días transcurridos
#
# workflow_dispatch permite pruebas manuales.

on:
  schedule:
    - cron: "0 14 * * 1"        # 9:00 AM EST, todos los lunes
  workflow_dispatch:

jobs:
  recordatorios:
    name: Recordatorios de cobro semanales
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: billing/requirements.txt

      - name: Instalar dependencias
        run: pip install -r billing/requirements.txt

      - name: Enviar recordatorios
        run: python billing/reminders.py
        env:
          RINGBA_API_TOKEN:            ${{ secrets.RINGBA_API_TOKEN }}
          RINGBA_ACCOUNT_ID:           ${{ secrets.RINGBA_ACCOUNT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BILLING_SPREADSHEET_ID:      ${{ secrets.BILLING_SPREADSHEET_ID }}
          DISCORD_WEBHOOK_BILLING:     ${{ secrets.DISCORD_WEBHOOK_BILLING }}
          ZOHO_CLIENT_ID:              ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET:          ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN:          ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_REFRESH_TOKEN_CRM:      ${{ secrets.ZOHO_REFRESH_TOKEN_CRM }}
