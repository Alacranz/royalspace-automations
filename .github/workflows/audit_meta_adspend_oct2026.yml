name: Audit Meta Adspent Oct 2026 - read only
on:
  push:
    branches: [audit/meta-adspend-octubre-2026-20261124]
    paths: [.github/workflows/audit_meta_adspend_oct2026.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Query Meta spend by account and exact date range
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v25.0' }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys
          sys.path.insert(0,"profit")
          from common.meta_client import get_spend_range
          
          with open("profit/config.json",encoding="utf-8") as f:
              cfg=json.load(f)
          people=[
              ("Esteban","esteban ramirez"),
              ("Douglas","douglas contreras"),
              ("Luis","luis salas"),
              ("Kevin","kevin pernia"),
              ("Clara","clara castro"),
              ("Cordova","edixon cordova"),
              ("Sebastian","sebastian reyes"),
              ("Caribay","caribay flores")
          ]
          periods=[
              ("S1","2026-09-28","2026-10-04"),
              ("S2","2026-10-05","2026-10-11"),
              ("S3","2026-10-12","2026-10-18"),
              ("S4","2026-10-19","2026-10-25"),
              ("S5","2026-10-26","2026-11-01"),
              ("OCT","2026-10-01","2026-10-31"),
          ]
          token=os.environ["META_ACCESS_TOKEN"]
          version=os.getenv("META_API_VERSION","v25.0")
          members=cfg.get("media_buyers",[])
          for key,start,end in periods:
              total=0.0
              for alias,search in people:
                  matched=[x for x in members if search in str(x.get("display_name","")).lower()]
                  if len(matched)!=1 or not matched[0].get("facebook_ad_account_id"):
                      raise RuntimeError("Mapping problem for "+alias)
                  adid=matched[0]["facebook_ad_account_id"]
                  amount=get_spend_range(token,version,adid,start,end)
                  total+=amount
                  print("META_AUDIT_ROW|%s|%s|%.4f"%(key,alias,amount),flush=True)
              print("META_AUDIT_TOTAL|%s|%.4f"%(key,total),flush=True)
          
          PY
