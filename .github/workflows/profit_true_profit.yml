name: Profit — True Profit

# Corre cada 30 minutos. El script verifica horario laboral internamente:
#   Lunes-Viernes 08:00-20:00 EST | Sábado 08:00-14:00 EST | Domingo: nunca
# EST = UTC-5 (EDT = UTC-4 en verano). El script usa America/New_York (pytz).
#
# Canal Discord: #mod (DISCORD_WEBHOOK_MOD)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  true-profit:
    name: True Profit Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: profit/requirements.txt

      - name: Instalar dependencias
        run: pip install -r profit/requirements.txt

      - name: Ejecutar True Profit
        run: python profit/true_profit.py
        env:
          RINGBA_API_TOKEN:       ${{ secrets.RINGBA_API_TOKEN }}
          RINGBA_ACCOUNT_ID:      ${{ secrets.RINGBA_ACCOUNT_ID }}
          META_ACCESS_TOKEN:      ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION:       ${{ vars.META_API_VERSION || 'v25.0' }}
          DISCORD_WEBHOOK_MOD:    ${{ secrets.DISCORD_WEBHOOK_MOD }}
