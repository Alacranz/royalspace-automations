name: Profit — True Profit + MB Alerts

# Disparado por workflow_dispatch — YA NO tiene trigger `schedule:`.
# GitHub descarta con frecuencia los triggers de schedule en repos de poca
# actividad (confirmado 2026-09-28: de ~24 corridas/hora programadas, solo
# llegaban a correr 3-4 al día). En su lugar, el proceso de Railway
# (manychat/main.py, corre 24/7) dispara este workflow vía la API de GitHub
# cada hora en horario laboral: Lunes-Viernes 08:00-20:00 EST, Sábado
# 08:00-14:00 EST, Domingo nunca. Ver manychat/main.py → start_github_scheduler().
#
# El script sigue verificando horario laboral internamente igual (is_business_hours),
# como red de seguridad — force_run="false" en el dispatch automático respeta eso.
# EST = UTC-5 (EDT = UTC-4 en verano). El script usa America/New_York (pytz).
#
# Envía 3 mensajes por run:
#   1. True Profit completo  → DISCORD_WEBHOOK_MOD (#mod)
#   2. MB Internal Perf.     → DISCORD_WEBHOOK_MB_INTERNAL (#mb-alerts)
#   3. MB External Perf.     → DISCORD_WEBHOOK_MB_EXTERNAL (servidor externo)

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Ignorar horario laboral (para pruebas manuales)"
        required: false
        default: "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  true-profit:
    name: True Profit Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: profit/requirements.txt

      - name: Instalar dependencias
        run: pip install -r profit/requirements.txt

      - name: Ejecutar True Profit + MB Alerts
        run: python profit/true_profit.py
        env:
          RINGBA_API_TOKEN:            ${{ secrets.RINGBA_API_TOKEN }}
          RINGBA_ACCOUNT_ID:           ${{ secrets.RINGBA_ACCOUNT_ID }}
          META_ACCESS_TOKEN:           ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION:            ${{ vars.META_API_VERSION || 'v25.0' }}
          DISCORD_WEBHOOK_MOD:         ${{ secrets.DISCORD_WEBHOOK_MOD }}
          DISCORD_WEBHOOK_MB_INTERNAL: ${{ secrets.DISCORD_WEBHOOK_MB_INTERNAL }}
          DISCORD_WEBHOOK_MB_EXTERNAL: ${{ secrets.DISCORD_WEBHOOK_MB_EXTERNAL }}
          CALLGRID_API_KEY:            ${{ secrets.CALLGRID_API_KEY }}
          CALLGRID_ORG_ID:             ${{ secrets.CALLGRID_ORG_ID }}
          SENTRY_DSN:                  ${{ secrets.SENTRY_DSN }}
          FORCE_RUN:                   ${{ github.event.inputs.force_run || 'false' }}
