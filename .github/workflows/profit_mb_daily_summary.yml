name: Profit — MB Daily Summary

# Corre cada mañana de lunes a domingo a las 8:00 AM EST (13:00 UTC).
# El domingo muestra el resumen del sábado anterior.
# Muestra el resumen COMPLETO del día anterior con fecha.
# No tiene verificación de horario laboral — corre incondicionalmente.
#
# Envía 2 mensajes:
#   1. MB Internal Daily Summary → DISCORD_WEBHOOK_MB_INTERNAL
#   2. MB External Daily Summary → DISCORD_WEBHOOK_MB_EXTERNAL

on:
  schedule:
    - cron: "0 13 * * *"      # 8:00 AM EST (UTC-5) · lunes a domingo
  workflow_dispatch:

jobs:
  mb-daily-summary:
    name: MB Daily Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: profit/requirements.txt

      - name: Instalar dependencias
        run: pip install -r profit/requirements.txt

      - name: Ejecutar MB Daily Summary
        run: python profit/mb_daily_summary.py
        env:
          RINGBA_API_TOKEN:            ${{ secrets.RINGBA_API_TOKEN }}
          RINGBA_ACCOUNT_ID:           ${{ secrets.RINGBA_ACCOUNT_ID }}
          META_ACCESS_TOKEN:           ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION:            ${{ vars.META_API_VERSION || 'v25.0' }}
          DISCORD_WEBHOOK_MB_INTERNAL: ${{ secrets.DISCORD_WEBHOOK_MB_INTERNAL }}
          DISCORD_WEBHOOK_MB_EXTERNAL: ${{ secrets.DISCORD_WEBHOOK_MB_EXTERNAL }}
