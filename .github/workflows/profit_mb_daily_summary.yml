name: Profit — MB Daily Summary

# Disparado por workflow_dispatch — YA NO tiene trigger `schedule:`.
# GitHub descarta/retrasa con frecuencia los triggers de schedule en repos de
# poca actividad (visto: programado 7:00 AM, llegó 12:40 PM; luego movido a
# 4:00 AM y aun así llegó a las 12:28 PM — el problema es de la plataforma,
# no del horario elegido). En su lugar, el proceso de Railway
# (manychat/main.py, corre 24/7) dispara este workflow vía la API de GitHub
# todos los días a las 4:00 AM VET. Ver manychat/main.py → start_github_scheduler().
#
# El domingo muestra el resumen del sábado anterior.
# Muestra el resumen COMPLETO del día anterior con fecha.
# No tiene verificación de horario laboral — corre incondicionalmente.
#
# Envía 2 mensajes:
#   1. MB Internal Daily Summary → DISCORD_WEBHOOK_MB_INTERNAL
#   2. MB External Daily Summary → DISCORD_WEBHOOK_MB_EXTERNAL

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mb-daily-summary:
    name: MB Daily Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: profit/requirements.txt

      - name: Instalar dependencias
        run: pip install -r profit/requirements.txt

      - name: Ejecutar MB Daily Summary
        run: python profit/mb_daily_summary.py
        env:
          RINGBA_API_TOKEN:            ${{ secrets.RINGBA_API_TOKEN }}
          RINGBA_ACCOUNT_ID:           ${{ secrets.RINGBA_ACCOUNT_ID }}
          META_ACCESS_TOKEN:           ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION:            ${{ vars.META_API_VERSION || 'v25.0' }}
          DISCORD_WEBHOOK_MB_INTERNAL: ${{ secrets.DISCORD_WEBHOOK_MB_INTERNAL }}
          DISCORD_WEBHOOK_MB_EXTERNAL: ${{ secrets.DISCORD_WEBHOOK_MB_EXTERNAL }}
          CALLGRID_API_KEY:            ${{ secrets.CALLGRID_API_KEY }}
          CALLGRID_ORG_ID:             ${{ secrets.CALLGRID_ORG_ID }}
          SENTRY_DSN:                  ${{ secrets.SENTRY_DSN }}
