name: Debug — Inspect Ringba Fields

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Inspect Ringba fields
        env:
          RINGBA_API_TOKEN:  ${{ secrets.RINGBA_API_TOKEN }}
          RINGBA_ACCOUNT_ID: ${{ secrets.RINGBA_ACCOUNT_ID }}
        run: python profit/inspect_ringba_fields.py
