name: Daily Cost Report — Dentista Latino

on:
  schedule:
    # 9:00 AM VET (UTC-4) = 13:00 UTC — lunes a sábado
    - cron: "0 13 * * 1-6"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Send daily report
        env:
          DISCORD_WEBHOOK_MOD:  ${{ secrets.DISCORD_WEBHOOK_MOD }}
          WEBHOOK_STATS_URL:    ${{ secrets.WEBHOOK_STATS_URL }}
          RAILWAY_TOKEN:        ${{ secrets.RAILWAY_TOKEN }}
          ANTHROPIC_BALANCE:    ${{ secrets.ANTHROPIC_BALANCE }}
        run: python monitoring/daily_report.py
