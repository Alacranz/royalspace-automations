name: Asistencia Mensual

# Venezuela Standard Time = UTC-4 (sin DST)
# El 1° de cada mes a las 10:00 AM VET = 14:00 UTC
# Genera el resumen del mes anterior con Excel adjunto en Discord

on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch: # permite ejecución manual desde GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reporte-mensual:
    name: Resumen mensual de asistencia
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: asistencia/requirements.txt

      - name: Instalar dependencias
        run: pip install -r asistencia/requirements.txt

      - name: Ejecutar reporte mensual
        run: python asistencia/monthly_report.py
        env:
          JIBBLE_CLIENT_ID:            ${{ secrets.JIBBLE_CLIENT_ID }}
          JIBBLE_CLIENT_SECRET:        ${{ secrets.JIBBLE_CLIENT_SECRET }}
          JIBBLE_ORG_ID:               ${{ secrets.JIBBLE_ORG_ID }}
          DISCORD_WEBHOOK_ASISTENCIA:  ${{ secrets.DISCORD_WEBHOOK_ASISTENCIA }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID:              ${{ secrets.SPREADSHEET_ID }}

      - name: Subir Excel como artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: asistencia-mensual-${{ github.run_id }}
          path: asistencia/Asistencia_*.xlsx
          retention-days: 90
