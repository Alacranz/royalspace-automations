name: Profit — ZIP Code Report (Mensual)

on:
  schedule:
    # Día 1 de cada mes, 5:00 AM EST (10:00 UTC) — cierra mes anterior
    - cron: "0 10 1 * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  zip-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r profit/requirements.txt

      - name: Run ZIP Monthly Report
        env:
          RINGBA_API_TOKEN:          ${{ secrets.RINGBA_API_TOKEN }}
          RINGBA_ACCOUNT_ID:         ${{ secrets.RINGBA_ACCOUNT_ID }}
          DISCORD_WEBHOOK_MB_INTERNAL: ${{ secrets.DISCORD_WEBHOOK_MB_INTERNAL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ZIP_SPREADSHEET_ID:        ${{ secrets.ZIP_SPREADSHEET_ID }}
          REPORT_MODE: monthly
        run: python profit/zip_report.py
