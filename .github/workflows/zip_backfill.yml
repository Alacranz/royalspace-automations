name: Profit — ZIP Backfill (una sola corrida)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r profit/requirements.txt

      - name: Run ZIP Backfill
        env:
          RINGBA_API_TOKEN:            ${{ secrets.RINGBA_API_TOKEN }}
          RINGBA_ACCOUNT_ID:           ${{ secrets.RINGBA_ACCOUNT_ID }}
          DISCORD_WEBHOOK_ZIP:         ${{ secrets.DISCORD_WEBHOOK_ZIP }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ZIP_SPREADSHEET_ID:          ${{ secrets.ZIP_SPREADSHEET_ID }}
        run: python profit/zip_backfill.py
