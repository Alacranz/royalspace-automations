<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DC Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { background-color: #0f0f1a; color: #e5e5e5; }
    .card { background-color: #1a1a2e; border: 1px solid #2d2d4e; }
    .btn { background-color: #2d2d4e; }
    .btn:hover { background-color: #3d3d5e; }
  </style>
</head>
<body class="min-h-screen">
  <nav class="card border-b px-6 py-4 flex items-center justify-between">
    <div class="font-semibold text-lg">DC Dashboard</div>
    {% if user %}
    <div class="flex items-center gap-4 text-sm">
      {% block nav_links %}{% endblock %}
      <span class="text-gray-400">{{ user.email }}</span>
      <a href="/logout" class="btn px-3 py-1 rounded">Salir</a>
    </div>
    {% endif %}
  </nav>
  <main class="p-6 max-w-6xl mx-auto">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
