{% extends "base.html" %}
{% block title %}Iniciar sesión — DC Dashboard{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-20 card rounded-lg p-8">
  <h1 class="text-xl font-semibold mb-6 text-center">Iniciar sesión</h1>
  {% if error %}
  <div class="bg-red-900/40 border border-red-700 text-red-200 text-sm rounded p-3 mb-4">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm text-gray-400 mb-1">Email</label>
      <input type="email" name="email" required class="w-full rounded bg-[#0f0f1a] border border-[#2d2d4e] px-3 py-2">
    </div>
    <div>
      <label class="block text-sm text-gray-400 mb-1">Contraseña</label>
      <input type="password" name="password" required class="w-full rounded bg-[#0f0f1a] border border-[#2d2d4e] px-3 py-2">
    </div>
    <button type="submit" class="w-full btn rounded py-2 font-medium">Entrar</button>
  </form>
</div>
{% endblock %}
